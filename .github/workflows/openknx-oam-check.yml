# Check build of OpenKNX OAM (merging/building of OpenKNX knxprod for combination of all referenced module versions + build of full releases)
# Copyright (C) 2024-2026 Cornelius Koepp (OpenKNX); For Usage in OpenKNX-Project only

name: selftest--openknx-oam-check
run-name: Selftest OpenKNX OAM Check

on:
  workflow_call:
    inputs:
      oam:
        type: string
        default: ${{ github.event.repository.name }}
      oam_ref:
        type: string
        default: ${{ github.ref_name }}
      restore_branch:
        type: boolean
        default: false
      target:
        required: true
        type: string
      KNXPROD_PREFIX:
        required: true
        type: string

jobs:
  oam-build:
    runs-on: ubuntu-latest

    name: Build '${{ inputs.target }}' ${{ inputs.restore_branch && 'branch' || 'commit' }}
    steps:

      - name: Checkout OAM
        uses: actions/checkout@v6
        with:
          repository: openknx/${{ inputs.oam }}
          ref: ${{ steps.oam_branch.outputs.ref_name }}
          path: ${{ inputs.oam }}

      - name: Restore OAM
        shell: pwsh
        run: |
          cd ${{ inputs.oam }}/restore 
          if ("${{ inputs.restore_branch }}" -eq "true") {
            ./Restore-Dependencies-Branch.ps1
          } else {
            ./Restore-Dependencies.ps1
          }

      - name: Setup OpenKNXproducer
        uses: openknx/setup-openknxproducer@v1

      - name: Create knxprod (Precheck to fail fast before pio-setup)
        run: |
          cd ${{ inputs.oam }}
          OpenKNXproducer create --Debug -h include/knxprod.h src/${{inputs.KNXPROD_PREFIX}}${{ inputs.target != '' && format('-{0}', inputs.target) || '' }} 2>&1 | tee producer.log
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            # Collect all outputs starting with "-->"
            error_lines=$(grep -E '^\s*(-->|Unhandled exception\.)' producer.log | grep -Ev -- '--> Skipping creation of src/[^ \.]+\.knxprod due to check errors! <--' | tr '\n' ' // ')
            if [ -n "$error_lines" ]; then
              echo "::error:: $error_lines"
            fi
            exit $exit_code
          fi

          warn_lines=$(grep -E '^\s*-->\s*WARN' producer.log | tr '\n' ' // ')
          if [ -n "$warn_lines" ]; then
            echo "::warning:: $warn_lines"
          fi

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install virtualenv
          virtualenv ~/.platformio/penv
          source ~/.platformio/penv/bin/activate
          pip install platformio

      - name: OpenKNX Release Build
        run: |
          cd ${{ inputs.oam }}
          pwsh ./scripts/Build-Release.ps1 ${{ inputs.target }}

      - name: Show Changed Files
        run: |
          cd ${{ inputs.oam }}
          git diff
