# Check build of OpenKNX OFM with Reference OAM (merging/building of OpenKNX knxprod + build of full releases)
# Copyright (C) 2024-2026 Cornelius Koepp (OpenKNX); For Usage in OpenKNX-Project only

name: openknx-ofm-check
run-name: Check OpenKNX OFM Build in Reference OAM

on:
  workflow_call:
    inputs:
      ofm:
        required: true
        type: string
      ofm_ref:
        type: string
        default: v1
      ofm_prefix:
        required: true
        type: string
      oam:
        required: true
        type: string
      # oam_ref:
      #   type: string
      #   default: v1
      target:
        required: true
        type: string
      # restore_branch:
      #   required: true
      #   type: boolean
      KNXPROD_PREFIX:
        required: true
        type: string

jobs:
  oam-build:
    runs-on: ubuntu-latest

    name: Build '${{ inputs.target }}' ${{ inputs.restore_branch && 'branch' || 'commit' }}
    steps:

      - name: Check for Same Name Branch in Reference OAM
        id: oam_branch
        run: |
          # TODO allow explicit definition of OAM-branch-name via oam_ref
          OFM_BRANCH='${{ inputs.ofm_ref }}'
          BRANCH='v1dev'
          EXISTS=$(git ls-remote --heads "https://github.com/openknx/${{ inputs.oam }}.git" "${OFM_BRANCH}" | wc -l)
          if [ "$EXISTS" -gt 0 ]; then
            BRANCH="${OFM_BRANCH}"
          fi
          echo "ref_name=$BRANCH" >> $GITHUB_OUTPUT
          echo "Selected branch: $BRANCH"

      # 1. checkout OAM
      # 2. restore
      # 3. overwrite OFM with current commit

      - name: Checkout Reference OAM
        uses: actions/checkout@v6
        with:
          repository: openknx/${{ inputs.oam }}
          ref: ${{ steps.oam_branch.outputs.ref_name }}
          path: ${{ inputs.oam }}

      - name: Restore OAM
        shell: pwsh
        run: |
          cd ${{ inputs.oam }}/restore 
          ./Restore-Dependencies.ps1

      - name: Restore Current OFM Commit
        uses: actions/checkout@v6
        with:
          repository: openknx/${{ inputs.ofm }}
          ref: ${{ inputs.ofm_ref }}
          path: ${{ inputs.ofm }}

      - name: Extract OFM-version (major.minor) from library.json
        id: get_version
        run: |
          cd '${{ inputs.ofm }}'
          VERSION=$(jq -r '.version' library.json)
          VERSION_MAJOR_MINOR=$(echo "$VERSION" | grep -oE '^[0-9]+\.[0-9]+')
          echo "VERSION_MAJOR_MINOR=$VERSION_MAJOR_MINOR" >> $GITHUB_ENV
          echo "OFM-Version: $VERSION_MAJOR_MINOR"

      - name: Patch OAM to Current OFM-Version ${{ env.VERSION_MAJOR_MINOR }}
        run: |
          cd ${{ inputs.oam }}
          # TODO use XML-tool for robust patching
          sed --in-place=ORIGINAL 's/\(<op:config name="%${{ inputs.ofm_prefix }}_VerifyVersion%"[ ]*value="\)[^"]*\(".*\/>\)/\1'"$VERSION_MAJOR_MINOR"'\2/' src/*.conf.xml
          echo "Set %${{ inputs.ofm_prefix }}_VerifyVersion% to $VERSION_MAJOR_MINOR"

      - name: Setup OpenKNXproducer
        uses: openknx/setup-openknxproducer@v1

      - name: Create knxprod (Precheck to fail fast before pio-setup)
        run: |
          cd ${{ inputs.oam }}
          OpenKNXproducer create --Debug -h include/knxprod.h src/${{inputs.KNXPROD_PREFIX}}${{ inputs.target != '' && format('-{0}', inputs.target) || '' }}

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install virtualenv
          virtualenv ~/.platformio/penv
          source ~/.platformio/penv/bin/activate
          pip install platformio

      - name: OpenKNX Release Build
        run: |
          cd ${{ inputs.oam }}
          pwsh ./scripts/Build-Release.ps1 ${{ inputs.target }}

      - name: Show Changed Files
        run: |
          cd ${{ inputs.oam }}
          git diff
