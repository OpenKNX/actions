name: selftest--openknx-ofm-check
run-name: Selftest `openknx-ofm-check` (Matrix)

on: [push]

jobs:
  check:
    name: Check '${{ matrix.target }}' in '${{ matrix.oam }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - ofm: OFM-DFA
            # use ${{ github.ref_name }}
            ofm_ref: v1dev
            ofm_prefix: DFA
            oam: OAM-StateEngine
            # oam_ref: v1dev
            # knxprod_xml: StateEngine-DFA16-Release
            target: DFA16-Release
            KNXPROD_PREFIX: StateEngine

        # # [BUILD]: all build targets
        # target:
        #   - DFA16-Release
        # #  - ""
        #
        # # [REF]: same commit and (newest on) branch
        # # restore_branch:
        # #   - false
        # #   - true

    uses: ./.github/workflows/openknx-ofm-check.yml
    with:
      KNXPROD_PREFIX: ${{ matrix.KNXPROD_PREFIX }}
      ofm: ${{ matrix.ofm }}
      ofm_ref: ${{ matrix.ofm_ref }}
      ofm_prefix: ${{ matrix.ofm_prefix }}
      oam: ${{ matrix.oam }}
      target: ${{ matrix.target }}
      # restore_branch: ${{ matrix.restore_branch }}